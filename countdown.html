<!DOCTYPE html>
<html>
<head>
  <title>Countdown Transmission</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
      text-align: center;
      padding-top: 120px;
    }
    #timer {
      font-size: 50px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<h1>INCOMING TRANSMISSION</h1>
<p>The next message will arrive soon.</p>
<div id="timer"></div>

<script>
<script>
<script>

// Target date
var targetDate = new Date(2026, 2, 21, 13, 0, 0).getTime();

function updateTimer() {

  var now = new Date().getTime();
  var distance = targetDate - now;

  // If countdown finished
  if (distance <= 0) {
    clearInterval(timerInterval);
    window.location.href = "coordinates.html";
    return;
  }

  // Time calculations
  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);

  // Show countdown
  var display = days + "d " + hours + "h " + minutes + "m " + seconds + "s";
  document.getElementById("timer").innerHTML = display;
}

// Update every second
var timerInterval = setInterval(updateTimer, 1000);
updateTimer();

</script>

</body>
</html>
